name: Build APK
on:
  push:
    branches: [main, master]
    tags: ["v*"]          # pushing a tag like v1.0.0 publishes a GitHub Release
  workflow_dispatch:

permissions:
  contents: write         # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode the release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing, so this release cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CYBERSKINOS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          CYBERSKINOS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CYBERSKINOS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CYBERSKINOS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          cd "$(dirname "$SETTINGS")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          echo "Running $TASK"
          gradle $TASK --no-daemon --console=plain > build.log 2>&1 || {
            echo "=== COMPILER ERRORS ==="
            grep -E "^e: " build.log
            tail -n 40 build.log
            exit 1
          }

      - name: Check what is inside the APK
        run: |
          APK=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -ic "assets/sounds/.*wav" | sed 's/^/sound files: /'

      # Ordinary pushes: a test build in the Actions tab
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: cyberskinos-apk
          path: "**/build/outputs/apk/debug/*.apk"

      # Tags: rename, checksum and publish to the Releases page
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK=$(find . -path "*/build/outputs/apk/release/*" -name "*.apk" | head -n 1)
          mkdir -p dist
          cp "$APK" "dist/CyberSkinOS-${GITHUB_REF_NAME}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true          # review the notes, then press Publish
