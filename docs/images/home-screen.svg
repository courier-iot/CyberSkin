<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <!-- A preview of the CyberSkinOS home screen in the Stellarite palette -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1226"/>
      <stop offset="1" stop-color="#060919"/>
    </linearGradient>
    <radialGradient id="neb" cx="1" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#00C2B3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00C2B3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111C36" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#0B1226" stop-opacity="0.88"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00B3A6" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00B3A6" fill-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="panel" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path d="M10 0H100V90L90 100H0V10Z" fill="url(#glass)" stroke="#00C2B3" stroke-opacity="0.8" stroke-width="0.8" vector-effect="non-scaling-stroke"/>
    </symbol>
  </defs>

  <rect width="360" height="740" fill="url(#bg)"/>
  <rect width="360" height="740" fill="url(#grid)"/>
  <rect width="360" height="740" fill="url(#neb)"/>
  <g fill="#fff">
    <circle cx="40" cy="120" r="0.9" opacity="0.6"/><circle cx="300" cy="60" r="1.2" opacity="0.8"/>
    <circle cx="210" cy="300" r="0.8" opacity="0.5"/><circle cx="80" cy="520" r="1" opacity="0.6"/>
    <circle cx="330" cy="600" r="0.8" opacity="0.5"/><circle cx="150" cy="690" r="1.1" opacity="0.7"/>
    <circle cx="20" cy="380" r="0.7" opacity="0.4"/><circle cx="260" cy="440" r="0.9" opacity="0.5"/>
  </g>
  <ellipse cx="330" cy="70" rx="140" ry="52" fill="none" stroke="#00B3A6" stroke-opacity="0.18" stroke-width="1.5" transform="rotate(-28 330 70)"/>

  <!-- status bar -->
  <text x="20" y="22" fill="#8FA6B8" font-size="11">9:41</text>

  <!-- Holo clock -->
  <use href="#panel" x="16" y="40" width="328" height="140"/>
  <rect x="16" y="40" width="328" height="140" fill="url(#scan)"/>
  <path d="M34 41H76" stroke="#00C2B3" stroke-width="2"/>
  <g font-family="'Roboto Mono', monospace" font-size="56" fill="#7FFFF2" filter="url(#glow)" text-anchor="middle">
    <path d="M50 60h52v74H50Z M112 60h52v74h-52Z M196 60h52v74h-52Z M258 60h52v74h-52Z" fill="#00C2B3" fill-opacity="0.07" stroke="#00C2B3" stroke-opacity="0.7"/>
    <text x="76" y="118">0</text><text x="138" y="118">9</text>
    <text x="222" y="118">4</text><text x="284" y="118">1</text>
    <rect x="176" y="80" width="5" height="5"/><rect x="176" y="106" width="5" height="5"/>
  </g>
  <text x="180" y="162" fill="#E8F4FA" font-size="11" letter-spacing="2.5" text-anchor="middle">SUNDAY, 8 NOV</text>

  <!-- Power cell -->
  <use href="#panel" x="16" y="192" width="158" height="150"/>
  <circle cx="95" cy="258" r="42" fill="#03050C" stroke="#00665F" stroke-width="2"/>
  <path d="M68.8 284.2A36 36 0 1 1 129 246" fill="none" stroke="#00C2B3" stroke-width="5" filter="url(#glow)"/>
  <circle cx="95" cy="258" r="34" fill="none" stroke="#7FFFF2" stroke-width="0.8"/>
  <text x="95" y="322" fill="#7FFFF2" font-size="13" font-weight="bold" text-anchor="middle">Power cell</text>
  <text x="95" y="336" fill="#8FA6B8" font-size="10.5" text-anchor="middle">78% charged</text>

  <!-- Atmos -->
  <use href="#panel" x="186" y="192" width="158" height="150"/>
  <g transform="translate(206 214)">
    <circle cx="22" cy="22" r="14" fill="#7FFFF2" filter="url(#glow)"/>
    <circle cx="22" cy="22" r="10" fill="none" stroke="#00C2B3" stroke-width="1.5"/>
    <path d="M28 46h34a10 10 0 0 0-2-20 14 14 0 0 0-26 2 9 9 0 0 0-6 18Z" fill="#B5EFE8" stroke="#00B3A6" stroke-width="1.5"/>
  </g>
  <text x="300" y="246" fill="#7FFFF2" font-size="26" font-weight="bold" text-anchor="middle">-4°C</text>
  <text x="204" y="300" fill="#E8F4FA" font-size="11">Light snow, feels -9°</text>
  <text x="204" y="316" fill="#E8F4FA" font-size="10.5">H -2°  L -11°  ·  60% snow</text>
  <text x="204" y="332" fill="#8FA6B8" font-size="10">Wind 22 km/h</text>

  <!-- Vitals -->
  <use href="#panel" x="16" y="354" width="328" height="118"/>
  <g font-size="10.5" fill="#E8F4FA">
    <text x="32" y="386">POWER</text><text x="32" y="420">STORAGE</text><text x="32" y="454">MEMORY</text>
  </g>
  <g fill="#00C2B3" filter="url(#glow)">
    <path d="M110 375h150l-6 16H104Z" fill="#02040A" stroke="#00C2B3"/>
    <path d="M110 409h150l-6 16H104Z" fill="#02040A" stroke="#00C2B3"/>
    <path d="M110 443h150l-6 16H104Z" fill="#02040A" stroke="#00C2B3"/>
    <g id="seg"><rect x="112" y="378" width="6" height="10"/><rect x="121" y="378" width="6" height="10"/><rect x="130" y="378" width="6" height="10"/><rect x="139" y="378" width="6" height="10"/><rect x="148" y="378" width="6" height="10"/><rect x="157" y="378" width="6" height="10"/><rect x="166" y="378" width="6" height="10"/><rect x="175" y="378" width="6" height="10"/><rect x="184" y="378" width="6" height="10"/><rect x="193" y="378" width="6" height="10"/><rect x="202" y="378" width="6" height="10"/><rect x="211" y="378" width="6" height="10"/></g>
    <g transform="translate(0 34)"><rect x="112" y="378" width="6" height="10"/><rect x="121" y="378" width="6" height="10"/><rect x="130" y="378" width="6" height="10"/><rect x="139" y="378" width="6" height="10"/><rect x="148" y="378" width="6" height="10"/><rect x="157" y="378" width="6" height="10"/></g>
    <g transform="translate(0 68)" fill="#FFB13D"><rect x="112" y="378" width="6" height="10"/><rect x="121" y="378" width="6" height="10"/><rect x="130" y="378" width="6" height="10"/><rect x="139" y="378" width="6" height="10"/><rect x="148" y="378" width="6" height="10"/><rect x="157" y="378" width="6" height="10"/><rect x="166" y="378" width="6" height="10"/><rect x="175" y="378" width="6" height="10"/><rect x="184" y="378" width="6" height="10"/><rect x="193" y="378" width="6" height="10"/><rect x="202" y="378" width="6" height="10"/><rect x="211" y="378" width="6" height="10"/><rect x="220" y="378" width="6" height="10"/><rect x="229" y="378" width="6" height="10"/></g>
  </g>
  <g font-size="10.5" fill="#8FA6B8" text-anchor="end">
    <text x="330" y="386">78%</text><text x="330" y="420">41% full</text><text x="330" y="454">86% used</text>
  </g>

  <!-- Quick access -->
  <use href="#panel" x="16" y="484" width="328" height="122"/>
  <text x="32" y="508" fill="#7FFFF2" font-size="13" font-weight="bold">Quick access</text>
  <g fill="#111C36" stroke="#00B3A6" stroke-width="1.5">
    <circle cx="62" cy="556" r="26"/><circle cx="140" cy="556" r="26"/><circle cx="218" cy="556" r="26"/><circle cx="296" cy="556" r="26"/>
  </g>
  <g fill="#7FF5E8" opacity="0.85">
    <circle cx="62" cy="556" r="14"/><rect x="126" y="542" width="28" height="28" rx="7"/><path d="M218 540l16 16-16 16-16-16Z"/><circle cx="296" cy="556" r="9" fill="none" stroke="#7FF5E8" stroke-width="5"/>
  </g>

  <!-- the Stellarite star -->
  <g transform="translate(296 676)">
    <circle r="34" fill="#0B1226" stroke="#7FFFF2" stroke-width="1.5" filter="url(#glow)"/>
    <ellipse rx="26" ry="10" fill="none" stroke="#00B3A6" stroke-opacity="0.7" stroke-width="1.2" transform="rotate(-28)"/>
    <path d="M0-22L-3.5-3.5 0 0Z M-22 0L-3.5-3.5 0 0Z" fill="#00B3A6"/>
    <path d="M0-22L3.5-3.5 0 0Z M-22 0L-3.5 3.5 0 0Z" fill="#00766C"/>
    <path d="M22 0L3.5-3.5 0 0Z M0 22L-3.5 3.5 0 0Z" fill="#C4FF00"/>
    <path d="M22 0L3.5 3.5 0 0Z M0 22L3.5 3.5 0 0Z" fill="#84A300"/>
    <path d="M0-2.2L2.2 0 0 2.2-2.2 0Z" fill="#EFFFF8"/>
    <circle cx="21" cy="-17" r="3" fill="#C4FF00"/>
  </g>
</svg>
